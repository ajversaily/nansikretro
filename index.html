<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NANSIK RETRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #0a0a0a;
      --white: #ffffff;
      --grey: #888;
      --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif: 'EB Garamond', Georgia, serif;
    }

    body {
      background: var(--white);
      color: var(--black);
      font-family: var(--font-sans);
      font-weight: 300;
      letter-spacing: 0.04em;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 40px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--black);
    }

    .nav-link {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--black);
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .nav-link:hover { opacity: 1; }

    /* HERO IMAGE */
    .hero {
      margin-top: 70px;
      width: 100%;
    }

    .hero-image-wrap {
      width: 100%;
      overflow: hidden;
    }

    .hero-image-wrap a {
      display: block;
    }

    .hero-image-wrap img {
      width: 100%;
      height: 92vh;
      object-fit: cover;
      object-position: center center;
      display: block;
      filter: contrast(1.01) brightness(1.01);
      animation: fadein 1.6s cubic-bezier(0.25,0.46,0.45,0.94) both;
    }

    @keyframes fadein {
      from { opacity: 0; transform: scale(1.04); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* PRODUCT SECTION */
    .product-section {
      width: 100%;
      padding: 72px 24px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: rise 1s 0.4s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .product-label {
      font-size: 0.58rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 14px;
    }

    .product-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .product-sub {
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 44px;
    }

    .rule {
      width: 28px;
      height: 1px;
      background: var(--black);
      opacity: 0.15;
      margin-bottom: 44px;
    }

    .btn-main {
      display: inline-block;
      background: var(--black);
      color: var(--white);
      text-decoration: none;
      font-size: 0.6rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      padding: 17px 58px;
      border: 1px solid var(--black);
      margin-bottom: 18px;
      transition: background 0.28s, color 0.28s;
    }
    .btn-main:hover {
      background: var(--white);
      color: var(--black);
    }

    .btn-ghost {
      display: inline-block;
      color: var(--black);
      text-decoration: none;
      font-size: 0.57rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(0,0,0,0.25);
      padding-bottom: 3px;
      opacity: 0.55;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .btn-ghost:hover { opacity: 1; border-color: var(--black); }

    /* FOOTER */
    footer {
      margin-top: 60px;
      border-top: 1px solid rgba(0,0,0,0.07);
      padding: 30px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-brand {
      font-family: var(--font-serif);
      font-size: 0.82rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--black);
    }

    .footer-links { display: flex; gap: 24px; }

    .footer-link {
      font-size: 0.57rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--black);
      opacity: 0.45;
      transition: opacity 0.2s;
    }
    .footer-link:hover { opacity: 1; }

    @media (max-width: 600px) {
      nav { padding: 16px 20px; }
      .hero-image-wrap img { height: 60vh; }
      .product-section { padding: 52px 20px 40px; }
      footer { flex-direction: column; gap: 22px; text-align: center; }
      .footer-links { flex-wrap: wrap; justify-content: center; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="https://www.instagram.com/nansik_retrokit/" class="nav-logo">Nansik Retro</a>
    <a href="https://www.instagram.com/nansik_retrokit/" class="nav-link">Shop</a>
  </nav>

  <section class="hero">
    <div class="hero-image-wrap">
      <a href="https://www.instagram.com/nansik_retrokit/" target="_blank" rel="noopener">
        <img
          src="https://scontent-ord5-3.xx.fbcdn.net/v/t1.15752-9/649765319_731532276593075_3860998679212504901_n.jpg?stp=dst-jpg_s960x960_tt6&_nc_cat=104&ccb=1-7&_nc_sid=9f807c&_nc_ohc=Akx_fKzpYLIQ7kNvwEr68FY&_nc_oc=AdlFCaZyXVvXvtL1kSUYtDstjmZnsLNKgdUt3-_w2HEwLRJ_Qgtu7V3xCWT_XSWhBsU&_nc_zt=23&_nc_ht=scontent-ord5-3.xx&_nc_ss=8&oh=03_Q7cD4wGzsp3BDfI9UR06bMQdyWWRFO_kqmkARPS4ynm93CQdwg&oe=69E156F6"
          alt="Nansik Retro Kit"
        />
      </a>
    </div>

    <div class="product-section">
      <p class="product-label">Nansik Retro</p>
      <h1 class="product-title">Nansik Retro Kit</h1>
      <p class="product-sub">1:1</p>
      <div class="rule"></div>
      <a href="https://www.instagram.com/nansik_retrokit/" class="btn-main" target="_blank" rel="noopener">Shop Now</a>
      <br>
      <a href="https://www.instagram.com/nansik_retrokit/" class="btn-ghost" target="_blank" rel="noopener">@nansik_retrokit</a>
    </div>
  </section>

  <footer>
    <a href="https://www.instagram.com/nansik_retrokit/" class="footer-brand">Nansik Retro</a>
    <div class="footer-links">
      <a href="https://www.instagram.com/nansik_retrokit/" class="footer-link" target="_blank">Instagram</a>
      <a href="https://www.instagram.com/nansik_retrokit/" class="footer-link" target="_blank">Shop</a>
      <a href="https://www.instagram.com/nansik_retrokit/" class="footer-link" target="_blank">Contact</a>
    </div>
  </footer>

</body>
</html>
